services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/nuc/jellyfin/config:/config
      - /home/nuc/jellyfin/cache:/cache
      - /home/nuc/media/movies:/data/movies
      - /home/nuc/media/tv:/data/tvshows
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:libtorrentv1
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata # Matched to your local timezone
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /home/nuc/qbittorrent/config:/config
      - /home/nuc/media:/downloads # Unified parent path for future hardlink support
    restart: unless-stopped

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    ports:
      - "8081:8080" # Web UI accessible at http://<your-nuc-ip>:8081
    volumes:
      - /run/udev:/run/udev:ro
      - /home/nuc/scrutiny/config:/opt/scrutiny/config
      - /home/nuc/scrutiny/data:/opt/scrutiny/influxdb
    cap_add:
      - SYS_RAWIO
    devices:
      # Maps your actual 465.8G SATA SSD into the container
      - "/dev/sda:/dev/sda"

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    network_mode: host
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    restart: unless-stopped

  suchi:
    image: goravg/suchi
    container_name: suchi
    ports:
      - "8082:80"
    volumes:
      - /home/nuc/media:/data:ro
    environment:
      SUCHI_DATA_ROOT: /data
      SUCHI_ADDR: :8082
    restart: unless-stopped