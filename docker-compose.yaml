services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
    volumes:
      - /home/nuc/jellyfin/config:/config
      - /home/nuc/jellyfin/cache:/cache
      - /home/nuc/media/movies:/data/movies
      - /home/nuc/media/tv:/data/tvshows
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    labels:
      goseeit.url: http://nuc.local:8096

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:libtorrentv1
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata # Matched to your local timezone
      - WEBUI_PORT=8080
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /home/nuc/qbittorrent/config:/config
      - /home/nuc/media:/downloads # Unified parent path for future hardlink support
    restart: unless-stopped
    labels:
      goseeit.url: http://nuc.local:8080

  scrutiny:
    image: ghcr.io/analogj/scrutiny:master-omnibus
    container_name: scrutiny
    restart: unless-stopped
    ports:
      - "8081:8080" # Web UI accessible at http://<your-nuc-ip>:8081
    volumes:
      - /run/udev:/run/udev:ro
      - /home/nuc/scrutiny/config:/opt/scrutiny/config
      - /home/nuc/scrutiny/data:/opt/scrutiny/influxdb
    cap_add:
      - SYS_RAWIO
    devices:
      # Maps your actual 465.8G SATA SSD into the container
      - "/dev/sda:/dev/sda"
    labels:
      goseeit.url: http://nuc.local:8081

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    ports:
      - "9999:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    labels:
      goseeit.url: http://nuc.local:9999

  glances:
    image: nicolargo/glances:latest
    container_name: glances
    pid: host
    network_mode: host
    environment:
      - GLANCES_OPT=-w
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/os-release:/etc/os-release:ro
    restart: unless-stopped
    labels:
      goseeit.url: http://nuc.local:61208

  suchi:
    image: goravg/suchi
    container_name: suchi
    ports:
      - "80:8082"
    volumes:
      - /home/nuc/media:/data:ro
    environment:
      SUCHI_DATA_ROOT: /data
      SUCHI_ADDR: :8082
    restart: unless-stopped
    labels:
      goseeit.url: http://nuc.local:80
  goseeit:
    image: goravg/goseeit:latest
    container_name: goseeit
    restart: unless-stopped

    # Host network mode allows direct monitoring of physical network interfaces (e.g., wlo2, eth0)
    # and eliminates NAT virtualization overhead.
    network_mode: host

    # Host PID mode allows accurate host CPU utilization, load averages, and uptime
    pid: host

    # Required volumes for comprehensive host & Docker monitoring on Linux / Intel NUC
    volumes:
      # Docker daemon socket for container status & resource inspection
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Host procfs for CPU, memory, uptime, and load averages
      - /proc:/host/proc:ro

      # Host sysfs for hardware stats, temperature, and Intel DRM iGPU metrics
      - /sys:/host/sys:ro

      # Host root filesystem for storage capacity
      - /:/host/root:ro,rslave

      # Optional: Mount custom config.yaml if you wish to override settings via file
      # - ./config.yaml:/config.yaml:ro

    # Access to Intel Integrated GPU (DRM card0) for Iris Xe / UHD graphics
    devices:
      - /dev/dri:/dev/dri

    environment:
      # Direct gopsutil to host-mounted procfs and sysfs
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys

      # Server port
      - GOSEEIT_SERVER_PORT=3333

      # Intel NUC disk mount points or devices to monitor (adjust as needed, e.g. /dev/nvme0n1, /dev/sda)
      - GOSEEIT_MONITOR_DISKS=/host/root,/dev/sda,/dev/nvme0n1

      # Intel NUC network interfaces (e.g., wlo2 for WiFi, eth0/eno1 for Ethernet)
      # Leave empty or specify your NUC interface names
      - GOSEEIT_MONITOR_INTERFACES=wlo2,eth0,eno1

      # Docker container monitoring enabled
      - GOSEEIT_DOCKER_ENABLED=true
      - GOSEEIT_DOCKER_SOCKET=unix:///var/run/docker.sock

      # Intel GPU sysfs reader enabled
      - GOSEEIT_INTEL_GPU_ENABLED=true
    labels:
      goseeit.url: http://nuc.local:3333